name: Publish Package

on:
  release:
    types: [created]
    branches: [main]  # fires when you publish a release in GitHub UI

permissions:
  contents: write    # needed to attach assets to GitHub release
  id-token: write    # required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (OIDC requires v11.5.1+)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        # DO NOT set NODE_AUTH_TOKEN — it breaks OIDC auth